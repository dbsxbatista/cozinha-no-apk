<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozinha no App</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#111111;--mute:#6B6670;--line:#EADFE5;--acc:#FF4D94;--acc-t:#C2185B;--on-acc:#111111;--chip:#F5EFF2;--bad:#D6381E;--tile:#FFE6F0;--tile-line:#F8C3D8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Figtree",system-ui,sans-serif;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.wm b,.info b,.sheet .st{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
#app{max-width:480px;margin:0 auto;padding:0 16px 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:16px 0 10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:34px;font-weight:800;line-height:1.1}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:52px;height:auto;flex:none}
.wm{display:flex;flex-direction:column;line-height:1.05}
.wm span{font-size:15px;font-weight:500;color:var(--mute)}
.wm b{font-size:27px;font-weight:800;line-height:1.02}
.wm i{font-style:normal;color:var(--acc)}
#q{width:100%;font:inherit;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 12px}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--chip);font-weight:500;font-size:14px}
.chip.on{background:var(--acc);color:var(--on-acc);font-weight:700}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.sec{font-size:20px;margin:22px 0 10px}
.sec small{color:var(--mute);font-weight:500;font-size:14px}
.lbl{margin:6px 0 0;font-size:13px;font-weight:700;color:var(--mute)}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.main{flex:1;display:flex;align-items:center;gap:14px;padding:10px;text-align:left;min-width:0;-webkit-touch-callout:none}
.tile{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:14px;font-size:32px;background:var(--tile);border:1px solid var(--tile-line);overflow:hidden}
.tile.big{width:100%;height:180px;font-size:76px;border-radius:24px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.form .vh{position:absolute;width:1px;height:1px;padding:0;border:0;opacity:0;overflow:hidden}
.form .filebtn{display:block;font-size:16px;text-align:center;cursor:pointer}
.phrow{display:grid;gap:10px}
.info{display:flex;flex-direction:column;min-width:0}
.info b{font-size:18px;line-height:1.2}
.info small{color:var(--mute);font-size:14px}
.heart{width:52px;align-self:stretch;font-size:24px;color:var(--mute)}
.heart.on{color:var(--acc)}
.top .heart{width:44px;height:44px;align-self:auto}
.back{font-weight:700;padding:10px 0}
.empty{color:var(--mute);text-align:center;padding:40px 12px}
h2{font-size:30px;font-weight:800;margin:16px 0 10px;line-height:1.1}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--chip);border-radius:99px;padding:4px 12px;font-size:14px}
h3{font-size:22px;font-weight:700;margin:24px 0 10px}
.yield{font-weight:700;margin:2px 0 0;color:var(--acc-t)}
.seg{display:flex;gap:6px;margin:0 0 6px}
.seg button{flex:1;padding:9px 6px;border-radius:99px;background:var(--chip);font-weight:700;font-size:14px}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.note{color:var(--mute);font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin:1px 0 0}
.chk.done span{text-decoration:line-through;color:var(--mute)}
.chk span,.steps li span{min-width:0}
.steps{padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;padding:12px 0}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--on-acc);font-weight:700;display:grid;place-items:center;font-size:14px}
.src{color:var(--mute);font-size:14px;margin-top:20px}
.src a{color:var(--acc)}
.acts{display:grid;gap:10px;margin-top:28px}
.danger,.ghost{display:block;width:100%;padding:12px;border-radius:14px;font-weight:700}
.danger{border:1.5px solid var(--bad);color:var(--bad)}
.ghost{border:1.5px solid var(--line)}
.form{display:grid;gap:14px;padding-top:6px}
.form label{display:grid;gap:6px;font-weight:700;font-size:14px}
.form small{font-weight:400;color:var(--mute)}
.form input,.form select,.form textarea{font:inherit;font-weight:400;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.form .ck{display:flex;gap:10px;align-items:center;font-weight:500}
.form .ck input{width:22px;height:22px;padding:0;flex:none;accent-color:var(--acc)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row>*,.form input{min-width:0}
.primary{background:var(--acc);color:var(--on-acc);padding:14px;border-radius:14px;font-weight:700;font-size:16px}
.err{color:var(--bad);margin:0;min-height:1.4em;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:150px;padding:11px 0;border-radius:99px;font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--acc);color:var(--on-acc)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.sheet .st{font-weight:700;font-size:20px;line-height:1.2;margin-bottom:6px}
.sheet button{padding:14px;border-radius:14px;background:var(--chip);font-weight:700;text-align:center}
.sheet .bad{color:var(--bad)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:500}
.toast[hidden]{display:none}
.toast button{font-weight:700;color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast" role="status" hidden></div>
<nav class="tabs" aria-label="Seções">
<button data-tab="home">Receitas</button><button data-tab="fav">Favoritas</button><button data-tab="new">Nova</button>
</nav>
<script>
const CATS=['Pães','Comidas','Doces','Bebidas'];
const EM={'Pães':'🍞','Comidas':'🍲','Doces':'🍰','Bebidas':'🥤'};
const OLD={'Café da manhã':'Comidas','Almoço':'Comidas','Lanche':'Pães','Sobremesa':'Doces'};
const TM={.5:.75,1:1,2:1.3};
const MUG=.125;
const DIETS=[['veg','Vegetarianas'],['vegan','Veganas'],['zero','Zero açúcar'],['carne','Com carnes']];
const DL={carne:'Com carnes',veg:'Vegetariana',vegan:'Vegana',zero:'Zero açúcar'};
const R=(id,t,c,e,m,s,su,d,i,p,x)=>({id,t,c,e,m,s,su,d,i,p,...x});
const FS=[[1,'Receita toda'],[.5,'Meia receita'],[2,'Receita dupla']];
const GEN=['Misture todos os ingredientes em uma caneca grande (uns 300 ml) até ficar homogêneo.','Leve ao micro-ondas por cerca de 1 minuto e meio. Se o centro ainda estiver cru, volte por mais 20 segundos.','Espere amornar um pouco antes de comer.'];
const BRAND=`<div class="brand"><svg class="mark" viewBox="0 0 100 110" role="img" aria-label="Logo Cozinha no App"><defs><linearGradient id="lgk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A4A"/><stop offset="1" stop-color="#0B0B0B"/></linearGradient><linearGradient id="lgp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8DBB"/><stop offset="1" stop-color="#E0287A"/></linearGradient><linearGradient id="lgw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6D6D6"/></linearGradient><filter id="lgs" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".4"/></filter><filter id="lgb"><feGaussianBlur stdDeviation="2.5"/></filter></defs><ellipse cx="50" cy="106" rx="26" ry="3.5" fill="#000" opacity=".28" filter="url(#lgb)"/><g filter="url(#lgs)"><rect x="24" y="4" width="52" height="96" rx="13" fill="url(#lgk)"/></g><rect x="24.8" y="4.8" width="50.4" height="94.4" rx="12.4" fill="none" stroke="#fff" stroke-opacity=".2"/><rect x="29" y="11" width="42" height="82" rx="9" fill="url(#lgp)"/><rect x="42" y="14" width="16" height="3.4" rx="1.7" fill="#0B0B0B" opacity=".5"/><path d="M43 41c-3.5-4.5 3.5-7.5 0-12M57 41c-3.5-4.5 3.5-7.5 0-12" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/><g filter="url(#lgs)"><rect x="34" y="47" width="32" height="6" rx="3" fill="url(#lgw)"/><path d="M36 54h28v10a10 10 0 0 1-10 10H46a10 10 0 0 1-10-10z" fill="url(#lgw)"/><path d="M36 59h-5M64 59h5" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g></svg><div class="wm"><b>Cozinha</b><b>no App</b></div></div>`;
const BASE=[
R('rv01','Morango do amor','Doces','🍓',40,15,'unidades','veg',['400 g de morango','200 g de leite condensado','15 g de manteiga','300 g de açúcar','150 g de água','1 g de corante alimentício vermelho'],['Lave e seque muito bem os morangos, porque a água estraga a calda.','Cozinhe o leite condensado com a manteiga, mexendo, até virar um brigadeiro cremoso. Deixe esfriar e recheie os morangos.','Leve o açúcar, a água e o corante ao fogo médio, sem mexer, até a calda endurecer ao pingar em água gelada.','Espete os morangos em palitos, mergulhe rápido na calda quente, gire e deixe secar sobre papel manteiga untado.']),
R('rv02','Pudim de leite condensado','Doces','🍮',80,10,'fatias','veg',['395 g de leite condensado','400 g de leite','3 ovos','150 g de açúcar','50 g de água'],['Derreta o açúcar em fogo médio até dourar, junte a água com cuidado e espalhe a calda na forma.','Bata no liquidificador o leite condensado, o leite e os ovos.','Despeje na forma, cubra com papel-alumínio e asse em banho-maria a 180 °C por 50 minutos.','Espere esfriar e leve à geladeira por pelo menos 4 horas antes de desenformar.']),
R('rv03','Brigadeirão','Doces','🍫',70,10,'fatias','veg',['395 g de leite condensado','400 g de leite','3 ovos','40 g de chocolate em pó','15 g de manteiga','150 g de açúcar'],['Faça o caramelo com o açúcar e espalhe na forma de pudim.','Bata no liquidificador o leite condensado, o leite, os ovos, o chocolate e a manteiga.','Asse em banho-maria a 180 °C por 50 minutos.','Deixe esfriar e gele por 4 horas antes de desenformar.']),
R('rv04','Brownie de chocolate','Doces','🍫',40,12,'unidades','veg',['200 g de chocolate meio amargo','150 g de manteiga','200 g de açúcar','3 ovos','100 g de farinha de trigo','30 g de cacau em pó'],['Derreta o chocolate com a manteiga e deixe amornar.','Misture o açúcar e os ovos e junte ao chocolate.','Acrescente a farinha e o cacau.','Asse em forma untada a 180 °C por 25 minutos. O centro deve ficar úmido.']),
R('rv05','Bolo de cenoura com cobertura de chocolate','Doces','🥕',60,10,'fatias','veg',['300 g de cenoura','3 ovos','110 g de óleo','360 g de açúcar','300 g de farinha de trigo','12 g de fermento em pó','200 g de chocolate meio amargo','100 g de creme de leite'],['Bata no liquidificador a cenoura, os ovos e o óleo.','Misture com o açúcar e a farinha e, por último, o fermento.','Asse em forma untada a 180 °C por 40 minutos.','Derreta o chocolate com o creme de leite, espalhe sobre o bolo morno e deixe firmar.'],{mug:{}}),
R('rv06','Cheesecake japonês','Doces','🍰',125,8,'fatias','veg',['250 g de cream cheese','100 g de leite','4 ovos','80 g de açúcar','40 g de amido de milho','20 g de manteiga','10 g de suco de limão'],['Derreta o cream cheese com o leite e a manteiga em banho-maria e deixe amornar.','Misture as gemas, o amido e o suco de limão.','Bata as claras com o açúcar até picos moles e incorpore com cuidado.','Asse em banho-maria a 160 °C por 60 minutos e deixe esfriar dentro do forno desligado.']),
R('rv07','Mousse de maracujá','Doces','🍨',20,8,'porções','veg',['395 g de leite condensado','200 g de creme de leite','150 g de polpa de maracujá'],['Bata tudo no liquidificador por 1 minuto.','Distribua em taças ou em um refratário.','Leve à geladeira por pelo menos 3 horas e sirva gelada.']),
R('rv08','Bolo de laranja de liquidificador','Doces','🍊',55,10,'fatias','veg',['1 laranja grande com casca','3 ovos','100 g de óleo','250 g de açúcar','280 g de farinha de trigo','12 g de fermento em pó'],['Bata no liquidificador a laranja cortada com a casca, os ovos, o óleo e o açúcar.','Misture com a farinha e, por último, o fermento.','Asse em forma untada a 180 °C por 40 minutos.'],{mug:{}}),
R('rv09','Macarrão de forno com feta','Comidas','🍝',40,3,'porções','veg',['200 g de queijo feta','300 g de tomate-cereja','30 g de azeite','250 g de macarrão penne','2 dentes de alho','10 g de manjericão'],['Coloque o feta no centro de uma travessa, cerque com os tomates e o alho e regue com o azeite.','Asse a 200 °C por 30 minutos, até o queijo dourar e os tomates estourarem.','Cozinhe o macarrão enquanto isso.','Amasse tudo com um garfo até virar molho cremoso, misture o macarrão e finalize com manjericão.']),
R('rv10','Chips de macarrão na air fryer','Comidas','🍝',25,2,'porções','veg',['150 g de macarrão penne cozido','15 g de azeite','10 g de queijo parmesão ralado','2 g de orégano seco','2 g de sal'],['Misture o macarrão cozido e escorrido com o azeite, o parmesão, o orégano e o sal.','Espalhe em uma única camada na air fryer.','Asse a 200 °C por 10 a 12 minutos, mexendo na metade, até ficar crocante.','Sirva com molho de tomate ou iogurte.']),
R('rv11','Ovos com pesto','Comidas','🍳',10,1,'porções','veg',['2 ovos','15 g de pesto de manjericão','5 g de azeite','1 pitada de sal'],['Aqueça o azeite com o pesto em fogo médio por 30 segundos.','Quebre os ovos por cima e tampe.','Cozinhe por 3 a 4 minutos, até a clara firmar, e sirva com pão.']),
R('rv12','Macarrão com queijo cremoso','Comidas','🧀',30,4,'porções','veg',['300 g de macarrão cotovelo','40 g de manteiga','30 g de farinha de trigo','500 g de leite','200 g de queijo cheddar ralado','5 g de sal'],['Cozinhe o macarrão e escorra.','Derreta a manteiga, junte a farinha e mexa por 1 minuto. Acrescente o leite aos poucos até engrossar.','Desligue o fogo e misture o queijo e o sal.','Misture o macarrão ao molho e sirva.']),
R('rv13','Salada de macarrão crocante','Comidas','🥗',30,6,'porções','veg',['250 g de macarrão parafuso cozido','100 g de maionese','100 g de milho cozido','100 g de ervilha cozida','100 g de cenoura ralada','40 g de batata palha','10 g de cebolinha'],['Misture o macarrão frio com a maionese, o milho, a ervilha, a cenoura e a cebolinha.','Leve à geladeira por 30 minutos.','Na hora de servir, cubra com a batata palha para manter a crocância.']),
R('rv14','Cebola empanada em flor','Comidas','🧅',45,4,'porções','veg',['1 cebola grande','100 g de farinha de trigo','2 ovos','100 g de farinha de rosca','5 g de sal','300 g de óleo para fritar'],['Descasque a cebola e faça cortes fundos a partir do topo, sem separar a base. Abra as pétalas.','Passe na farinha de trigo, nos ovos batidos e na farinha de rosca, cobrindo entre as pétalas. Repita o ovo e a farinha de rosca para uma casquinha mais grossa.','Frite em óleo quente por 5 a 7 minutos, até dourar, e escorra.']),
R('rv15','Torta de brócolis e cenoura sem massa','Comidas','🥧',45,6,'fatias','veg',['300 g de brócolis cozido','150 g de cenoura ralada','4 ovos','200 g de leite','60 g de farinha de trigo','100 g de queijo muçarela ralado','8 g de fermento em pó','4 g de sal'],['Bata os ovos, o leite, a farinha e o sal no liquidificador.','Misture o brócolis picado, a cenoura e o queijo e, por último, o fermento.','Despeje em forma untada e asse a 180 °C por 35 minutos.']),
R('rv16','Pimentão recheado com cream cheese','Comidas','🌶️',25,4,'porções','veg',['4 pimentões pequenos','200 g de cream cheese','10 g de cebolinha','30 g de salgadinho de milho','2 g de sal'],['Corte o topo dos pimentões e retire as sementes.','Misture o cream cheese com a cebolinha e o sal e recheie bem os pimentões.','Leve à geladeira por 20 minutos, corte em rodelas e sirva com o salgadinho esfarelado por cima.']),
R('rv17','Café dalgona','Bebidas','☕',10,1,'copos','veg',['15 g de café solúvel','15 g de açúcar','15 g de água quente','200 g de leite gelado'],['Bata o café, o açúcar e a água por 3 a 5 minutos, até virar um creme firme.','Coloque o leite gelado no copo e cubra com o creme.']),
R('rv18','Cappuccino caseiro cremoso','Bebidas','☕',5,2,'xícaras','veg',['10 g de café solúvel','10 g de chocolate em pó','10 g de açúcar','300 g de leite quente'],['Bata o café, o chocolate e o açúcar com um pouco do leite quente até espumar.','Complete com o restante do leite.']),
R('rv19','Chocolate quente cremoso','Bebidas','🍫',10,2,'xícaras','veg',['500 g de leite','100 g de chocolate meio amargo','20 g de açúcar','10 g de amido de milho'],['Dissolva o amido em um pouco do leite frio.','Aqueça o restante do leite com o açúcar, junte o chocolate picado e mexa até derreter.','Acrescente o amido dissolvido e mexa por 2 a 3 minutos, até engrossar.']),
R('rv20','Pão nuvem','Pães','☁️',40,4,'unidades','veg',['3 ovos','90 g de cream cheese','15 g de amido de milho','5 g de suco de limão'],['Separe as claras das gemas. Bata as gemas com o cream cheese e o amido até ficar liso.','Bata as claras com o suco de limão até picos firmes.','Incorpore as claras às gemas com delicadeza.','Faça montinhos em assadeira forrada e asse a 150 °C por 25 a 30 minutos.']),

const rf=v=>{const w=Math.floor(v),fr=v-w,b=[0,.25,1/3,.5,2/3,.75,1].reduce((a,x)=>Math.abs(x-fr)<Math.abs(a-fr)?x:a);return Math.max(.25,w+b)};
const rs=v=>Math.max(.25,v<2?Math.round(v*4)/4:v<6?Math.round(v*2)/2:Math.round(v));
const fs=r=>{const w=Math.floor(r+1e-6),fr=r-w,k=[[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾']].reduce((a,b)=>Math.abs(b[0]-fr)<Math.abs(a[0]-fr)?b:a);return((w||'')+' '+k[1]).trim()||'0'};
const fmt=(r,u,n)=>fs(r)+' '+UN[u][r>1?1:0]+' de '+n;
function home(g,n){
  const m=nz(n),pk=PK.find(x=>x[0].test(m));
  if(pk){const k=g/pk[1];if(k>=.45&&Math.abs(k*2-Math.round(k*2))<.15){const r=Math.round(k*2)/2;return fs(r)+' '+(r>1?pk[3]:pk[2])+' de '+n}}
  const c=cvf(n);if(!c)return null;
  if(g>=.45*c[1])return fmt(rf(g/c[1]),'xíc.',n);
  if(g>=.9*c[2])return fmt(rs(g/c[2]),'col. sopa',n);
  const t=c[2]/3;if(g>=.6*t)return fmt(rs(g/t),'col. chá',n);
  return '1 pitada de '+n;
}
function line([q,u,n],f,gm){
  if(!q)return esc(n);
  let v=q*f;
  const c=cvf(n);
  if(gm&&c&&UN[u]){v=u==='xíc.'?v*c[1]:u==='col. sopa'?v*c[2]:v*c[2]/3;u='g'}
  if(!gm&&(u==='g'||u==='ml')){const h=home(v,n);if(h)return esc(h)}
  if(UN[u]){
    if(u==='xíc.'&&v<.25){v*=16;u='col. sopa'}
    if(u==='col. sopa'&&v<1){v*=3;u='col. chá'}
    return esc(fmt(u==='xíc.'?rf(v):rs(v),u,n));
  }
  if(!u&&(q>1)!==(v>1))n=flex(n,v>1);
  if(u==='pitada'&&v>1)u='pitadas';
  const x=u==='g'||u==='ml'?(v>=10?''+Math.round(v):(''+(Math.round(v*2)/2||.5)).replace('.',',')):fq(v);
  return x+(u?' '+u+' de ':' ')+esc(n);
}
const card=r=>{const fv=favs.includes(r.id);return `<div class="card"><button class="main" data-act="open" data-id="${r.id}"><span class="tile">${tl(r)}</span><span class="info"><b>${esc(r.t)}</b><small>${esc(r.c)}, ${r.m} min</small></span></button><button class="heart${fv?' on':''}" data-act="fav" data-id="${r.id}" aria-pressed="${fv}" aria-label="Favoritar ${esc(r.t)}">${fv?'♥':'♡'}</button></div>`};
function list(){
  const q=S.q.trim().toLowerCase(),fav=S.tab==='fav';
  const rs=all().filter(r=>(!fav||favs.includes(r.id))&&(fav||!S.cat||r.c===S.cat)&&(fav||!S.dt||r.d===S.dt)&&(!q||(r.t+' '+r.i.join(' ')).toLowerCase().includes(q)));
  $('#list').innerHTML=rs.length?DIETS.map(([k,l])=>{const g=rs.filter(r=>r.d===k);return g.length?'<h3 class="sec">'+l+' <small>'+g.length+'</small></h3>'+g.map(card).join(''):''}).join(''):`<p class="empty">${fav?'Toque no coração de uma receita para guardá-la aqui.':'Nenhuma receita encontrada. Tente outro nome ou ingrediente.'}</p>`;
}
function body(r){
  const gm=!!S.gm[r.id],mug=!!r.mug&&S.f===MUG,sc=r.i.some(x=>parse(x)[0]),p=mug?(r.mug.p||GEN):r.p;
  const chips=FS.concat(r.mug?[[MUG,'Bolo de caneca']]:[]).map(([f,l])=>`<button class="chip${S.f===f?' on':''}" data-act="f" data-f="${f}">${l}</button>`).join('');
  return `<div class="tags"><span class="tag">${esc(DL[r.d]||'')}</span><span class="tag">${esc(r.c)}</span><span class="tag">${mug?(r.mug.m||5)+' min':S.f===1?r.m+' min':'cerca de '+Math.max(5,Math.round(r.m*(TM[S.f]||1)/5)*5)+' min'}</span></div>
${sc?`<h3>Quanto fazer?</h3><div class="chips">${chips}</div>`:''}
<p class="yield">Rende ${mug?'1 caneca':fq(r.s*S.f)+' '+esc(r.su)}</p>
${mug?'<p class="note">A caneca usa ⅛ da receita. As medidas pequenas são aproximadas: se der meio ovo, bata o ovo e use metade. Confira o ponto e ajuste ao seu gosto.</p>':''}
${!mug&&S.f!==1?'<p class="note">Tempo estimado para essa quantidade. Os tempos citados nos passos são os da receita inteira, então confira o ponto antes de tirar do forno ou do fogo.</p>':''}
<h3>Ingredientes</h3><div class="seg" role="group" aria-label="Unidade das medidas"><button data-act="gm" data-m="0" class="${gm?'':'on'}">Colher e xícara</button><button data-act="gm" data-m="1" class="${gm?'on':''}">Gramas</button></div>${r.i.map((s,k)=>{const key=r.id+':'+k,d=S.done[key];return `<label class="chk${d?' done':''}"><input type="checkbox" data-k="${key}"${d?' checked':''}><span>${line(parse(s),S.f,gm)}</span></label>`}).join('')}
<h3>Modo de preparo</h3><ol class="steps">${p.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>`;
}
function detail(r){
  const fv=favs.includes(r.id);
  return `<header class="top"><button class="back" data-act="back">‹ Voltar</button><button class="heart${fv?' on':''}" data-act="fav" data-id="${r.id}" aria-pressed="${fv}" aria-label="Favoritar">${fv?'♥':'♡'}</button></header>
<div class="tile big">${tl(r)}</div><h2>${esc(r.t)}</h2><div id="scal">${body(r)}</div>
${r.tip?`<h3>Dicas</h3><p>${esc(r.tip)}</p>`:''}

<div class="acts"><button class="ghost" data-act="edit" data-id="${r.id}">Editar receita</button><button class="danger" data-act="del" data-id="${r.id}">Excluir receita</button></div>`;
}
const form=r=>`<header class="top"><h1>${r?'Editar receita':'Nova receita'}</h1></header><div class="form">
<div class="phrow"><div id="ph" class="tile big">${phv(S.ph)}</div><label class="ghost filebtn">Tirar foto ou escolher da galeria<input id="f-ph" class="vh" type="file" accept="image/*"></label><button class="ghost" data-act="rmph">Remover foto</button></div>
<label>Nome<input id="f-t" autocomplete="off" value="${r?esc(r.t):''}"></label>
<label>Seção<select id="f-x">${DIETS.map(([k,l])=>`<option value="${k}"${(r?r.d:'veg')===k?' selected':''}>${l}</option>`).join('')}</select></label>
<div class="row"><label>Categoria<select id="f-c">${CATS.map(c=>`<option${r&&r.c===c?' selected':''}>${c}</option>`).join('')}</select></label><label>Emoji<input id="f-e" maxlength="4" placeholder="🍰" value="${r?esc(r.e):''}"></label></div>
<div class="row"><label>Tempo (min)<input id="f-m" type="number" min="1" inputmode="numeric" value="${r?r.m:30}"></label><label>Rende${r?' ('+esc(r.su)+')':''}<input id="f-s" type="number" min="1" inputmode="numeric" value="${r?r.s:4}"></label></div>
<label>Ingredientes<small>Um por linha, com a quantidade em gramas na frente (ex.: 200 g de farinha). Assim dá para ajustar as porções.</small><textarea id="f-i" rows="6" placeholder="200 g de farinha&#10;3 ovos&#10;sal a gosto">${r?esc(r.i.join('\n')):''}</textarea></label>
<label>Modo de preparo<small>Um passo por linha</small><textarea id="f-p" rows="6">${r?esc(r.p.join('\n')):''}</textarea></label>
<label>Dicas<small>Opcional</small><textarea id="f-d" rows="3">${r&&r.tip?esc(r.tip):''}</textarea></label>
<label class="ck"><input id="f-g" type="checkbox"${r&&r.mug?' checked':''}>Permitir versão bolo de caneca (⅛ da receita)</label>
<p class="err" id="err" role="alert"></p><button class="primary" data-act="save">Salvar receita</button><button class="ghost" data-act="cancel">Cancelar</button></div>`;
function render(){
  const a=$('#app'),fav=S.tab==='fav';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab&&!S.edit));
  window.scrollTo(0,0);
  if(S.open){a.innerHTML=detail(find(S.open));return}
  if(S.tab==='new'){S.ph=S.edit?imgOf(S.edit):'';a.innerHTML=form(S.edit?find(S.edit):null);return}
  a.innerHTML=`<header class="top">${fav?'<h1>Favoritas</h1>':BRAND+'<input id="q" type="search" placeholder="Buscar receita ou ingrediente" aria-label="Buscar receita" value="'+esc(S.q)+'">'}</header>`+(fav?'':`<p class="lbl">Seção</p><div class="chips">${[['','Todas'],...DIETS].map(([k,l])=>`<button class="chip${S.dt===k?' on':''}" data-act="dt" data-v="${k}">${l}</button>`).join('')}</div><p class="lbl">Tipo</p><div class="chips">${['',...CATS].map(c=>`<button class="chip${S.cat===c?' on':''}" data-act="cat" data-v="${c}">${c||'Todas'}</button>`).join('')}</div>`)+'<p class="hint">Segure o dedo em uma receita para editar ou excluir.</p><div id="list"></div>';
  list();
}
const v=id=>document.getElementById(id).value;
let undo=null,tt=0,lt=0,lp=false,sx=0,sy=0;
function toast(msg){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span><button data-act="undo">Desfazer</button>`;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;if(undo&&undo.ci>=0)setImg(undo.id,'');undo=null},6000)}
function del(id){
  const r=find(id);if(!r)return;
  const ci=custom.findIndex(x=>x.id===id);
  if(ci>=0)custom.splice(ci,1);else gone.push(id);
  undo={id,r,ci,fav:favs.includes(id)};
  favs=favs.filter(x=>x!==id);persist();S.open=null;render();toast('“'+r.t+'” foi excluída');
}
function sheet(id){
  const r=find(id);if(!r)return;closeSheet();
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  const d=document.createElement('div');d.id='ov';d.className='ov';
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Opções da receita"><p class="st">${esc(r.t)}</p><button data-act="sedit" data-id="${id}">Editar receita</button><button class="bad" data-act="sdel" data-id="${id}">Excluir receita</button><button data-act="close">Cancelar</button></div>`;
  document.body.appendChild(d);d.querySelector('button').focus();
}
const closeSheet=()=>{const o=$('#ov');if(o)o.remove()};
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.main');lp=false;clearTimeout(lt);if(!c)return;sx=e.clientX;sy=e.clientY;lt=setTimeout(()=>{lp=true;sheet(c.dataset.id)},500)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>clearTimeout(lt)));
document.addEventListener('pointermove',e=>{if(lt&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)clearTimeout(lt)});
document.addEventListener('contextmenu',e=>{const c=e.target.closest('.main');if(c){e.preventDefault();if(!lp){lp=true;sheet(c.dataset.id)}}});
document.addEventListener('keydown',e=>{lp=false;if(e.key==='Escape')closeSheet()});
document.addEventListener('click',e=>{
  if(e.target.id==='ov'){closeSheet();return}
  const b=e.target.closest('[data-act],[data-tab]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(lp&&a==='open')return;
  if(b.dataset.tab){S.tab=b.dataset.tab;S.open=null;S.edit=null;render();return}
  if(a==='open'){S.open=id;S.f=1;render()}
  else if(a==='back'){S.open=null;render()}
  else if(a==='cat'){S.cat=b.dataset.v;render()}
  else if(a==='dt'){S.dt=b.dataset.v;render()}
  else if(a==='gm'){S.gm[S.open]=b.dataset.m==='1';try{localStorage.setItem('panela-gm',JSON.stringify(S.gm))}catch(e){}$('#scal').innerHTML=body(find(S.open))}
  else if(a==='f'){S.f=+b.dataset.f;$('#scal').innerHTML=body(find(S.open))}
  else if(a==='fav'){const k=favs.indexOf(id);k<0?favs.push(id):favs.splice(k,1);persist();if(S.open){const on=k<0;b.classList.toggle('on',on);b.textContent=on?'♥':'♡';b.setAttribute('aria-pressed',on)}else list()}
  else if(a==='edit'||a==='sedit'){closeSheet();S.edit=id;S.tab='new';S.open=null;render()}
  else if(a==='del'||a==='sdel'){closeSheet();del(id)}
  else if(a==='close')closeSheet();
  else if(a==='undo'&&undo){const u=undo;if(u.ci>=0)custom.splice(u.ci,0,u.r);else gone=gone.filter(x=>x!==u.id);if(u.fav)favs.push(u.id);undo=null;persist();$('#toast').hidden=true;render()}
  else if(a==='rmph'){S.ph='';$('#ph').innerHTML=phv('')}
  else if(a==='cancel'){S.tab='home';if(S.edit)S.open=S.edit;S.edit=null;render()}
  else if(a==='save'){
    const t=v('f-t').trim(),i=v('f-i').split('\n').map(s=>s.trim()).filter(Boolean),p=v('f-p').split('\n').map(s=>s.trim()).filter(Boolean);
    if(!t||!i.length||!p.length){$('#err').textContent=!t?'Dê um nome à receita.':!i.length?'Adicione ao menos um ingrediente.':'Adicione ao menos um passo.';return}
    const old=S.edit?find(S.edit):null,c=v('f-c');
    const r={id:old?old.id:'u'+Date.now(),t,c,e:Array.from(v('f-e').trim())[0]||EM[c],m:+v('f-m')||30,s:+v('f-s')||4,su:old?old.su:'porções',i,p,d:v('f-x')};
    const tip=v('f-d').trim();if(tip)r.tip=tip;
    if(!setImg(r.id,S.ph)){$('#err').textContent='Não há espaço para guardar essa foto. Tente uma foto menor ou remova outras fotos.';return}
    
    if($('#f-g').checked)r.mug=old&&old.mug?old.mug:{};
    if(!old)custom.push(r);else if(custom.some(x=>x.id===old.id))custom=custom.map(x=>x.id===old.id?r:x);else edits[old.id]=r;
    persist();S.tab='home';S.edit=null;S.open=r.id;S.f=1;render();
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;list()}});
document.addEventListener('change',e=>{
  if(e.target.id==='f-ph'){const f=e.target.files&&e.target.files[0];if(f)shrink(f,d=>{if(d){S.ph=d;$('#ph').innerHTML=phv(d)}else $('#err').textContent='Não consegui abrir essa foto. Tente outra.'});e.target.value='';return}
 if(e.target.matches('.chk input')){S.done[e.target.dataset.k]=e.target.checked;e.target.closest('label').classList.toggle('done',e.target.checked)}});
render();
</script>
</body>
</html>
